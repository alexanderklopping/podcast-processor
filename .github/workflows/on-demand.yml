name: On-Demand Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Mediaverwerker command (natural language or subcommand)'
        required: true
        type: string

concurrency:
  group: podcast-feeds-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          pip install -e .

      - name: Clone podcast-feeds repo
        run: |
          git clone https://x-access-token:${{ secrets.FEEDS_GITHUB_TOKEN }}@github.com/alexanderklopping/podcast-feeds.git feeds

      - name: Restore processed episodes
        run: |
          if [ -f feeds/processed_episodes.json ]; then
            cp feeds/processed_episodes.json processed_episodes.json
          fi

      - name: Run command
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEEDS_GITHUB_TOKEN: ${{ secrets.FEEDS_GITHUB_TOKEN }}
          INSTAGRAM_COOKIES_B64: ${{ secrets.INSTAGRAM_COOKIES_B64 }}
          IS_CLOUD: 'true'
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
          YTDLP_JS_RUNTIMES: node
          YTDLP_REMOTE_COMPONENTS: ejs:github
          YTDLP_EXTRACTOR_ARGS: youtube:player_skip=webpage;player_client=tv_embedded
          MW_COMMAND: ${{ inputs.command }}
        run: mediaverwerker run "$MW_COMMAND"

      - name: Push feeds to GitHub Pages
        run: |
          cd feeds
          cp ../processed_episodes.json . 2>/dev/null || true
          git config user.email "mediaverwerker@github.com"
          git config user.name "Mediaverwerker"
          git add .
          git diff --cached --quiet || git commit -m "Update feeds - $(date '+%Y-%m-%d %H:%M')"
          git push
